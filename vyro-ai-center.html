<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYRO Code Studio | AI Center</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#dbe7e5;background:#0b1215}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;background:#101d20;border-bottom:1px solid #29524c}h1{font-size:21px;margin:0;color:#69f3bc}h2{margin:0 0 12px}small,.muted{color:#92aaa7}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 75px)}nav{padding:15px;background:#10191d;border-right:1px solid #263d3a}nav button{display:block;width:100%;margin-bottom:7px;text-align:left}.main{padding:22px;max-width:1120px}button,input,select,textarea{font:inherit}button{background:#19332f;border:1px solid #35675a;color:#e1fff1;padding:9px 12px;border-radius:7px;cursor:pointer}button:hover{background:#245447}button.active,.primary{background:#16765a}button.danger{background:#532d35;border-color:#8c4653}input,select,textarea{background:#0d171a;color:#e1f3ed;border:1px solid #38514e;border-radius:6px;padding:10px;width:100%}textarea{min-height:100px}label{display:block;margin:12px 0 5px;color:#b3d5ca}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #2d4c45;background:#132023;padding:17px;border-radius:10px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.item{padding:10px;border-bottom:1px solid #304842;display:flex;align-items:center;justify-content:space-between;gap:10px}.item:last-child{border:0}pre{white-space:pre-wrap;word-break:break-word;background:#071113;border:1px solid #28443c;padding:12px;max-height:300px;overflow:auto}#status{font-size:13px;color:#91e7b9}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:7px}nav button{min-width:125px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>◈ VYRO CODE STUDIO — AI CENTER</h1><small>Walney Moreira Klein — walneyk@hotmail.com</small></div><span id="status">Configuração local</span></header><div class="layout"><nav id="nav"></nav><main class="main"><h2 id="heading"></h2><div id="view"></div></main></div>
<script>
'use strict';
const KEY='vyro-ai-center-v1';
const defaults={providers:[{id:'ollama',name:'Ollama Local',kind:'ollama',url:'http://localhost:11434',model:'qwen2.5-coder:3b',timeout:180,enabled:true}],skills:[],mcp:[],settings:{theme:'hacker',approval:true}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)}
const $=s=>document.querySelector(s),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));$('#status').textContent='Salvo neste navegador'};
const pages=[['providers','Provedores de IA'],['chat','Chat Ollama'],['skills','Skills'],['mcp','Servidores MCP'],['extensions','Extensões'],['settings','Configurações'],['logs','Diagnóstico']];
let page='providers';const log=[];function note(msg){log.unshift(new Date().toLocaleString('pt-BR')+' '+msg);$('#status').textContent=msg}
function render(){ $('#nav').innerHTML=pages.map(([id,title])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'">'+title+'</button>').join('');$('#heading').textContent=pages.find(x=>x[0]===page)[1];const v=$('#view');
if(page==='providers')v.innerHTML='<div class="card"><h3>Provedores cadastrados</h3><div id="items"></div></div><div class="card"><h3>Cadastrar / editar provedor</h3><form id="providerForm"><input type="hidden" name="id"><div class="grid"><div><label>Nome</label><input name="name" required></div><div><label>Tipo</label><select name="kind"><option value="ollama">Ollama</option><option value="openai-compatible">API compatível OpenAI</option><option value="groq">Groq</option><option value="openai">OpenAI</option><option value="gemini">Gemini (configuração)</option></select></div><div><label>URL base</label><input name="url" placeholder="http://localhost:11434" required></div><div><label>Modelo</label><input name="model" required></div><div><label>Timeout (segundos)</label><input name="timeout" type="number" min="5" max="3600" value="180"></div></div><p class="muted">Chaves de API não são armazenadas neste painel. Provedores externos exigirão backend seguro.</p><div class="toolbar"><button class="primary">Salvar provedor</button><button type="reset">Limpar</button></div></form></div>';
if(page==='skills')v.innerHTML='<div class="card"><h3>Biblioteca de Skills</h3><div id="items"></div></div><div class="card"><h3>Nova Skill</h3><form id="skillForm"><label>Nome</label><input name="name" required><label>Descrição</label><input name="description"><label>Instruções / prompt</label><textarea name="prompt" required></textarea><div class="toolbar"><button class="primary">Salvar Skill</button></div></form></div>';
if(page==='mcp')v.innerHTML='<div class="card"><h3>Servidores MCP cadastrados</h3><div id="items"></div></div><div class="card"><h3>Servidor MCP</h3><form id="mcpForm"><label>Nome</label><input name="name" required><label>Transporte</label><select name="transport"><option value="stdio">stdio</option><option value="http">HTTP</option></select><label>Comando (stdio) ou URL (HTTP)</label><input name="target" required><label>Argumentos (separados por linha; stdio)</label><textarea name="args"></textarea><p class="muted">Cadastro apenas: a execução MCP requer host nativo, permissões e confirmação por ferramenta.</p><button class="primary">Salvar servidor</button></form></div>';
if(page==='chat')v.innerHTML='<div class="card"><h3>Chat com Ollama local</h3><label>Provedor Ollama</label><select id="chatProvider">'+state.providers.filter(x=>x.kind==='ollama').map(x=>'<option value="'+escapeHTML(x.id)+'">'+escapeHTML(x.name)+'</option>').join('')+'</select><label>Mensagem</label><textarea id="prompt" placeholder="Explique este código..."></textarea><div class="toolbar"><button id="send" class="primary">Enviar</button><button id="stop">Cancelar</button></div><pre id="response" aria-live="polite">Aguardando mensagem.</pre><p class="muted">Conexão direta depende da configuração CORS do Ollama. Não desative a segurança do navegador.</p></div>';
if(page==='extensions')v.innerHTML='<div class="card"><h3>Extensões</h3><p>O Notepad++ já possui plugins nativos. O gerenciador integrado VYRO será implementado no executável C++ após a compilação-base.</p><p>Esta central não instala nem executa DLLs automaticamente.</p></div>';
if(page==='settings')v.innerHTML='<div class="card"><h3>Preferências e backup</h3><label><input id="approval" type="checkbox" style="width:auto" '+(state.settings.approval?'checked':'')+'> Exigir aprovação para ações de IA</label><div class="toolbar"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input id="file" type="file" accept=".json,application/json" class="hidden"></div><p class="muted">Os dados ficam no armazenamento local do navegador. Exportação não inclui chaves de API.</p></div>';
if(page==='logs')v.innerHTML='<div class="card"><h3>Eventos desta sessão</h3><pre>'+escapeHTML(log.join('\n')||'Sem eventos')+'</pre></div>';
if(['providers','skills','mcp'].includes(page))renderItems();
}
function renderItems(){const key=page;$('#items').innerHTML=state[key].map(x=>'<div class="item"><div><b>'+escapeHTML(x.name)+'</b><div class="muted">'+escapeHTML(x.model||x.description||x.transport)+' — '+escapeHTML(x.url||x.target||'')+'</div></div><div class="toolbar">'+(key==='providers'?'<button data-edit="'+escapeHTML(x.id)+'">Editar</button>':'')+'<button class="danger" data-delete="'+escapeHTML(x.id)+'">Excluir</button></div></div>').join('')||'<p class="muted">Nenhum cadastro.</p>'}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){page=b.dataset.page;render();return}
if(b.dataset.delete){if(!confirm('Excluir este cadastro?'))return;state[page]=state[page].filter(x=>x.id!==b.dataset.delete);save();renderItems();return}
if(b.dataset.edit){const p=state.providers.find(x=>x.id===b.dataset.edit),f=$('#providerForm');Object.keys(p).forEach(k=>{if(f.elements[k])f.elements[k].value=p[k]});return}
if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vyro-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if(b.id==='import')$('#file').click();
if(b.id==='send')sendChat();
if(b.id==='stop'&&controller){controller.abort();note('Requisição cancelada')}
});
document.addEventListener('submit',e=>{if(!['providerForm','skillForm','mcpForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));let key=f.id==='providerForm'?'providers':f.id==='skillForm'?'skills':'mcp';d.id=d.id||uuid();if(key==='providers'){d.timeout=Number(d.timeout);d.enabled=true}if(key==='mcp')d.args=d.args.split('\n').filter(Boolean);const i=state[key].findIndex(x=>x.id===d.id);if(i<0)state[key].push(d);else state[key][i]=d;save();note('Cadastro salvo: '+d.name);render()});
document.addEventListener('change',async e=>{if(e.target.id==='approval'){state.settings.approval=e.target.checked;save()}if(e.target.id==='file'){try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.providers)||!Array.isArray(data.skills)||!Array.isArray(data.mcp))throw Error('Formato inválido');if(!confirm('Substituir cadastros locais pelo arquivo?'))return;state={...structuredClone(defaults),...data};save();render()}catch(err){alert('Falha na importação: '+err.message)}}});
let controller=null;async function sendChat(){const p=state.providers.find(x=>x.id===$('#chatProvider').value),msg=$('#prompt').value.trim();if(!p||!msg)return;const out=$('#response');out.textContent='Consultando Ollama...';controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),Math.max(5,p.timeout)*1000);try{const r=await fetch(p.url.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:p.model,messages:[{role:'user',content:msg}],stream:false}),signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();out.textContent=data.message?.content||'Resposta vazia';note('Ollama respondeu')}catch(err){out.textContent='Falha: '+err.message+'\nVerifique se o Ollama está rodando e se permite requisições desta origem.';note('Falha na consulta')}finally{clearTimeout(timeout);controller=null}}
render();
</script></body></html>
